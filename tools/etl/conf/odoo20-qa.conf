; Manual-QA Odoo 20 server: serves ONE v20 database for side-by-side testing against the
; v19 baseline (port 8119). Default DB is sudi20_test (fresh install, no prod data);
; after ETL chapter 3, pass "-d sudi20_etl_dry1" on the command line to browse the
; migrated production data with the same config.
; Start (foreground, its own terminal):
;   /opt/odoo20/odoo20-venv/bin/python /opt/odoo20/odoo20/odoo-bin \
;       -c /opt/odoo20/custom/sudi_20/tools/etl/conf/odoo20-qa.conf
[options]
addons_path = /opt/odoo20/odoo20/addons,/opt/odoo20/ent,/opt/odoo20/custom/sudi_20
data_dir = /opt/odoo20/etl/data20
db_name = sudi20_test
dbfilter = ^sudi20_(test|etl_.*)$
list_db = False
http_port = 8123
gevent_port = 8124
workers = 0
max_cron_threads = 0
admin_passwd = sudi-etl-local
