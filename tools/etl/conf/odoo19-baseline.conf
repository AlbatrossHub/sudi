; Read-only Odoo 19 baseline server: renders the SOURCE snapshot (sudi_src19) so the
; website pages can be fetched/screenshotted before migration. Locked to that one DB.
; Start (foreground, its own terminal):
;   /opt/odoo19/odoo19-venv/bin/python /opt/odoo19/odoo19/odoo-bin \
;       -c /opt/odoo20/custom/sudi_20/tools/etl/conf/odoo19-baseline.conf
[options]
; custom addons = SNAPSHOT OF WHAT PROD ACTUALLY RUNS (rsync'd from sdppl:/opt/odoo19/sudi,
; commit 7bff18d / diamond 1.2.3). The local dev checkout /opt/odoo19/custom/sudi is AHEAD of
; prod (1.7.0, adds stored fields like res_partner.sudi_invoice_policy) and 500s on this DB.
addons_path = /opt/odoo19/odoo19/addons,/opt/odoo19/ent,/opt/odoo20/etl/prod_addons/sudi
data_dir = /opt/odoo20/etl/data19
db_name = sudi_src19
dbfilter = ^sudi_src19$
list_db = False
http_port = 8119
gevent_port = 8118
workers = 0
max_cron_threads = 0
admin_passwd = sudi-etl-local
